<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ember+ Tree (Read-only)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 1rem; }
    button { margin-bottom: 1rem; }
    .controls { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .controls input { padding: 0.2rem 0.4rem; }
    ul { list-style: none; padding-left: 1rem; }
    li { margin: 0.2rem 0; }
    .node { color: #0b57d0; }
    .parameter { color: #0b8043; }
    .function { color: #8e24aa; }
    summary { cursor: pointer; user-select: none; }
    .meta { color: #555; font-size: 0.9rem; }
    .error { color: #b00020; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Ember+ Tree (Read-only)</h1>
  <p>This view is read-only and only displays the current tree snapshot from the Ember+ provider.</p>
  <div class="controls">
    <label for="host">Host</label>
    <input id="host" type="text" value="localhost" />
    <label for="port">Port</label>
    <input id="port" type="number" min="1" max="65535" value="9000" />
    <button id="reload" type="button">Reload tree</button>
  </div>
  <div id="status" class="meta"></div>
  <div id="tree"></div>

  <script>
    const treeContainer = document.getElementById('tree');
    const statusEl = document.getElementById('status');
    const hostInput = document.getElementById('host');
    const portInput = document.getElementById('port');

    function getLabelText(element) {
      const identifier = element.identifier || '(no identifier)';
      const isParameter = typeof element.kind === 'string' && element.kind.toLowerCase() === 'parameter';
      if (isParameter && element.value !== null && element.value !== undefined) {
        return `${identifier}: ${element.value}`;
      }
      return identifier;
    }

    function renderElement(element) {
      const li = document.createElement('li');
      li.className = element.kind;

      const labelText = getLabelText(element);

      if (Array.isArray(element.children) && element.children.length > 0) {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = labelText;
        details.appendChild(summary);

        const ul = document.createElement('ul');
        for (const child of element.children) {
          ul.appendChild(renderElement(child));
        }
        details.appendChild(ul);
        li.appendChild(details);
      } else {
        const label = document.createElement('span');
        label.textContent = labelText;
        li.appendChild(label);
      }

      return li;
    }

    async function loadTree() {
      const host = hostInput.value.trim();
      const port = Number.parseInt(portInput.value, 10);

      if (!host) {
        statusEl.textContent = 'Host is required';
        treeContainer.innerHTML = '<div class="error">Please provide a host.</div>';
        return;
      }

      if (!Number.isInteger(port) || port < 1 || port > 65535) {
        statusEl.textContent = 'Port is invalid';
        treeContainer.innerHTML = '<div class="error">Please provide a valid port (1-65535).</div>';
        return;
      }

      statusEl.textContent = 'Loading tree...';
      treeContainer.textContent = '';

      try {
        const response = await fetch(`/api/tree?host=${encodeURIComponent(host)}&port=${port}`);
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.detail || `Request failed with status ${response.status}`);
        }

        const ul = document.createElement('ul');
        ul.appendChild(renderElement(payload));
        treeContainer.appendChild(ul);
        statusEl.textContent = `Loaded at ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        treeContainer.innerHTML = `<div class="error">${message}</div>`;
        statusEl.textContent = 'Failed to load tree';
      }
    }

    document.getElementById('reload').addEventListener('click', loadTree);
    loadTree();
  </script>
</body>
</html>
